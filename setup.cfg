[metadata]
name = certbot-dns-powerdns-admin
version = 0.1.0
description = Certbot DNS plugin for PowerDNS-Admin
author = Simon Spettmann
license = MIT

[options]
packages = find:
install_requires =
    certbot

[options.entry_points]
certbot.plugins =
    dns-powerdns-admin = certbot_dns_powerdns_admin.dns_powerdns_admin:Authenticator
